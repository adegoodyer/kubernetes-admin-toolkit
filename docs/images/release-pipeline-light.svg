<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="Pull requests are built and tested but publish nothing; version tags publish vX.Y.Z and latest; the weekly rebuild of master publishes latest, weekly and weekly-date.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .heading { font-size: 12px; font-weight: 600; fill: #59636e; letter-spacing: 0.04em; }
    .name { font-size: 14px; font-weight: 600; }
    .sub { font-size: 11px; fill: #59636e; }
    .step { font-size: 13px; }
    .label { font-size: 11px; fill: #59636e; }
    .tag { font-size: 12px; fill: #0969da; }
    .none { font-size: 13px; fill: #59636e; }
    .chip { fill: #f6f8fa; stroke: #d1d9e0; }
    .ci { fill: none; stroke: #8c959f; }
    .acc { fill: #ddf4ff; stroke: #0969da; }
    .muted-box { fill: none; stroke: #d1d9e0; stroke-dasharray: 5 4; }
    .arrow { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .head { fill: #59636e; }
    .rule { stroke: #d1d9e0; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <text class="heading" x="20" y="30">TRIGGER</text>
  <text class="heading" x="340" y="30">CI · .github/workflows/build.yml</text>
  <text class="heading" x="690" y="30">PUBLISHED TO DOCKER HUB</text>

  <!-- triggers -->
  <rect class="chip" x="20" y="72" width="220" height="56" rx="8"/>
  <text class="name" x="36" y="96">Pull request</text>
  <text class="sub" x="36" y="114">from Renovate or you</text>

  <rect class="chip" x="20" y="152" width="220" height="56" rx="8"/>
  <text class="name" x="36" y="176">Version tag</text>
  <text class="sub mono" x="36" y="194">git push origin vX.Y.Z</text>

  <rect class="chip" x="20" y="232" width="220" height="56" rx="8"/>
  <text class="name" x="36" y="256">Weekly rebuild</text>
  <text class="sub" x="36" y="274">Mon 03:00 UTC or manual, master</text>

  <!-- CI box -->
  <rect class="ci" x="330" y="56" width="280" height="248" rx="10"/>
  <text class="step" x="352" y="100">1</text><text class="step" x="374" y="100">Build amd64 and arm64</text>
  <text class="step" x="352" y="132">2</text><text class="step" x="374" y="132">Smoke test both images</text>
  <text class="step" x="352" y="164">3</text><text class="step" x="374" y="164">Scan with Grype</text>
  <text class="sub" x="374" y="181">results to the Security tab</text>
  <line class="rule" x1="352" y1="204" x2="588" y2="204"/>
  <text class="step" x="352" y="232">4</text><text class="step" x="374" y="232">Push, unless a PR</text>
  <text class="sub" x="374" y="249">multi-arch, with SBOM and</text>
  <text class="sub" x="374" y="264">provenance attached</text>

  <!-- trigger to CI -->
  <line class="arrow" x1="240" y1="100" x2="328" y2="100" marker-end="url(#arrow)"/>
  <text class="label mono" x="284" y="92" text-anchor="middle">pull_request</text>
  <line class="arrow" x1="240" y1="180" x2="328" y2="180" marker-end="url(#arrow)"/>
  <text class="label mono" x="284" y="172" text-anchor="middle">push: tags</text>
  <line class="arrow" x1="240" y1="260" x2="328" y2="260" marker-end="url(#arrow)"/>
  <text class="label mono" x="284" y="252" text-anchor="middle">schedule</text>

  <!-- CI to outcomes -->
  <line class="arrow" x1="610" y1="100" x2="688" y2="100" marker-end="url(#arrow)"/>
  <text class="label" x="649" y="92" text-anchor="middle">check only</text>
  <line class="arrow" x1="610" y1="180" x2="688" y2="180" marker-end="url(#arrow)"/>
  <text class="label" x="649" y="172" text-anchor="middle">push</text>
  <line class="arrow" x1="610" y1="260" x2="688" y2="260" marker-end="url(#arrow)"/>
  <text class="label" x="649" y="252" text-anchor="middle">push</text>

  <!-- outcomes -->
  <rect class="muted-box" x="690" y="72" width="250" height="56" rx="8"/>
  <text class="none" x="706" y="96">Nothing published</text>
  <text class="sub" x="706" y="114">pass or fail shown on the PR</text>

  <rect class="acc" x="690" y="152" width="250" height="56" rx="8"/>
  <text class="tag mono" x="706" y="176">vX.Y.Z</text>
  <text class="tag mono" x="706" y="194">latest</text>

  <rect class="acc" x="690" y="232" width="250" height="56" rx="8"/>
  <text class="tag mono" x="706" y="256">latest, weekly</text>
  <text class="tag mono" x="706" y="274">weekly-YYYYMMDD</text>
</svg>
