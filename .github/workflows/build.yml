name: Build

# - Pull request touching the image: build and test both architectures, push nothing.
# - vX.Y.Z git tag: build, test, push vX.Y.Z and latest.
# - Weekly (and on demand from master): rebuild to pick up Ubuntu patches,
#   push latest, weekly and weekly-YYYYMMDD.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - scripts/smoke-test.sh
      - .github/workflows/build.yml
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: adegoodyer/kubernetes-admin-toolkit
  PLATFORMS: linux/amd64,linux/arm64
  # Only master (schedule/dispatch) and version tags publish. PRs and other branches never do.
  PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # upload scan results to the Security tab
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3 # runs the arm64 apt steps and smoke test

      - uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ env.PUSH }}
            type=raw,value=weekly,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=weekly-{{date 'YYYYMMDD'}},enable=${{ github.ref == 'refs/heads/master' }}

      # Build each architecture into the local Docker daemon and test it before anything is pushed.
      # pull: always use the current base image digest rather than a cached one.
      - name: Build amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          tags: toolkit:amd64

      - name: Smoke test amd64
        run: ./scripts/smoke-test.sh toolkit:amd64 linux/amd64

      - name: Build arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          pull: true
          load: true
          tags: toolkit:arm64

      - name: Smoke test arm64
        run: ./scripts/smoke-test.sh toolkit:arm64 linux/arm64

      # Report only: the image carries known unfixed CVEs (mostly from the archived mc),
      # so failing here would block every run.
      - name: Vulnerability scan
        id: scan
        uses: anchore/scan-action@v6
        with:
          image: toolkit:amd64
          fail-build: false
          output-format: sarif

      - name: Upload scan results
        if: env.PUSH == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      - name: Login to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Reuses the cached layers from the builds above, so this pushes what was tested.
      - name: Push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
