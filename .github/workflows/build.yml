name: Build

# - Pull request touching the image: build and test both architectures, push nothing.
# - vX.Y.Z git tag: build, test, push vX.Y.Z and latest.
# - Weekly (and on demand from master): rebuild to pick up Ubuntu patches,
#   push latest, weekly and weekly-YYYYMMDD.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - scripts/smoke-test.sh
      - .github/workflows/build.yml
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      test-notification:
        description: Only send a test Gotify notification (no build)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: adegoodyer/kubernetes-admin-toolkit
  PLATFORMS: linux/amd64,linux/arm64
  # Only master (schedule/dispatch) and version tags publish. PRs and other branches never do.
  PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  build:
    if: ${{ !inputs.test-notification }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # upload scan results to the Security tab
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4 # runs the arm64 apt steps and smoke test

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ env.PUSH }}
            type=raw,value=weekly,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=weekly-{{date 'YYYYMMDD'}},enable=${{ github.ref == 'refs/heads/master' }}

      # Build each architecture into the local Docker daemon and test it before anything is pushed.
      # pull: always use the current base image digest rather than a cached one.
      - name: Build amd64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          tags: toolkit:amd64

      - name: Smoke test amd64
        run: ./scripts/smoke-test.sh toolkit:amd64 linux/amd64

      - name: Build arm64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          pull: true
          load: true
          tags: toolkit:arm64

      - name: Smoke test arm64
        run: ./scripts/smoke-test.sh toolkit:arm64 linux/arm64

      # Report only: the image carries known unfixed CVEs (mostly from the archived mc),
      # so failing here would block every run.
      - name: Vulnerability scan
        id: scan
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          image: toolkit:amd64
          fail-build: false
          output-format: sarif

      - name: Upload scan results
        if: env.PUSH == 'true'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      - name: Login to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Reuses the cached layers from the builds above, so this pushes what was tested.
      - name: Push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

  # Alert on Gotify when a weekly, manual or release build fails. PR failures show on the PR instead.
  # Needs the repo secret GOTIFY_TOKEN (a Gotify application token); skipped if it isn't set.
  notify:
    needs: build
    if: ${{ always() && github.event_name != 'pull_request' && (contains(fromJSON('["failure","cancelled"]'), needs.build.result) || inputs.test-notification) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Gotify notification
        env:
          GOTIFY_URL: https://gotify.adegoodyer.com/message
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          RESULT: ${{ needs.build.result }}
          TEST: ${{ inputs.test-notification }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }} (${{ github.ref_name }})
        run: |
          if [ -z "$GOTIFY_TOKEN" ]; then
            echo "::warning::GOTIFY_TOKEN is not set, skipping notification"
            exit 0
          fi
          if [ "$TEST" = "true" ]; then
            title="🔔 kubernetes-admin-toolkit test notification"
            message="Gotify alerts from GitHub Actions are working. [View run]($RUN_URL)"
            priority=4
          else
            title="❌ kubernetes-admin-toolkit build $RESULT"
            message="**$TRIGGER** did not complete. [View run]($RUN_URL)"
            priority=8
          fi
          jq -n --arg title "$title" --arg message "$message" --argjson priority "$priority" --arg url "$RUN_URL" '{
            title: $title, message: $message, priority: $priority,
            extras: {
              "client::display": {contentType: "text/markdown"},
              "client::notification": {click: {url: $url}}
            }
          }' | curl -sS --fail-with-body -X POST "$GOTIFY_URL" \
                 -H "X-Gotify-Key: $GOTIFY_TOKEN" -H "Content-Type: application/json" -d @- >/dev/null
          echo "notification sent"
