name: Build

# - Pull request: build and test both architectures, push nothing. Runs on every PR because
#   "build" is a required check on master, and a required check that never runs blocks the merge.
# - Merge to master that changes the Dockerfile: build, test and release the next version
#   (push vX.Y.Z and latest, then create the git tag and GitHub release). See scripts/next-version.sh.
# - Weekly (and on demand from master): rebuild to pick up Ubuntu patches,
#   push latest, weekly and weekly-YYYYMMDD. Also releases if the Dockerfile changed since the last release.
# - vX.Y.Z git tag pushed by hand: build, test, push vX.Y.Z and latest.
on:
  pull_request:
  push:
    branches: [master]
    paths: [Dockerfile] # not applied to tag pushes
    tags: ["v*"]
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: adegoodyer/kubernetes-admin-toolkit
  PLATFORMS: linux/amd64,linux/arm64
  # Only master (schedule/dispatch) and version tags publish. PRs and other branches never do.
  PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # upload scan results to the Security tab
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history and tags, to work out the next version

      - name: Work out next version
        id: version
        if: github.ref == 'refs/heads/master'
        run: ./scripts/next-version.sh >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4 # runs the arm64 apt steps and smoke test

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Debug DNS (temporary)
        continue-on-error: true
        run: |
          echo "--- runner resolv.conf"; cat /etc/resolv.conf
          echo "--- runner upstream"; grep nameserver /run/systemd/resolve/resolv.conf || true
          echo "--- runner lookup"; getent hosts archive.ubuntu.com || echo RESOLVE_FAILED
          echo "--- plain docker run"; docker run --rm ubuntu:26.04 sh -c 'cat /etc/resolv.conf; getent hosts archive.ubuntu.com || echo RESOLVE_FAILED'
          echo "--- buildkit container resolv.conf"
          for c in $(docker ps --format '{{.Names}}' | grep buildx_buildkit); do docker exec "$c" cat /etc/resolv.conf; done
          echo "--- buildx RUN step"
          printf 'FROM ubuntu:26.04\nRUN cat /etc/resolv.conf; getent hosts archive.ubuntu.com || echo RESOLVE_FAILED\n' \
            | docker buildx build --no-cache --progress=plain - 2>&1 | grep -vE '^#[0-9]+ (sha256|resolve|DONE|extracting)'

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ env.PUSH }}
            type=raw,value=weekly,enable=${{ github.ref == 'refs/heads/master' && github.event_name != 'push' }}
            type=raw,value=weekly-{{date 'YYYYMMDD'}},enable=${{ github.ref == 'refs/heads/master' && github.event_name != 'push' }}

      # Build each architecture into the local Docker daemon and test it before anything is pushed.
      # pull: always use the current base image digest rather than a cached one.
      - name: Build amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          tags: toolkit:amd64

      - name: Smoke test amd64
        run: ./scripts/smoke-test.sh toolkit:amd64 linux/amd64

      - name: Build arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64
          pull: true
          load: true
          tags: toolkit:arm64

      - name: Smoke test arm64
        run: ./scripts/smoke-test.sh toolkit:arm64 linux/arm64

      # Report only: the image carries known unfixed CVEs (mostly from the archived mc),
      # so failing here would block every run.
      - name: Vulnerability scan
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: toolkit:amd64
          fail-build: false
          output-format: sarif

      - name: Upload scan results
        if: env.PUSH == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      - name: Login to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Reuses the cached layers from the builds above, so this pushes what was tested.
      - name: Push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

  # Tag the commit that was just published and create its GitHub release.
  # Tags created with GITHUB_TOKEN don't trigger workflows, so this doesn't start a second build.
  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
